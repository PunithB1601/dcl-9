<!DOCTYPE html>
<html xmlns="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>View Products</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-100 min-h-screen p-6">

    <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">
        Product List
    </h1>

  
    <div class="max-w-6xl mx-auto mb-6 flex justify-between items-center">

        <form th:action="@{/view}" method="get" class="flex gap-3">

			<select name="c" class="px-4 py-2 border rounded-lg">

				<option value="">All Categories</option>

				<option th:each="c : ${categories}" th:value="${c}" th:text="${c}">
				</option>
			</select>

			<button type="submit"
                    class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">
                Filter
            </button>

        </form>

        <a href="/add"
           class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition">
            Add Product
        </a>

    </div>

    <!-- 🧾 Products Grid -->
    <div class="max-w-6xl mx-auto grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">

        <div th:each="product : ${products}" 
             class="bg-white shadow-lg rounded-2xl overflow-hidden hover:shadow-xl transition">

            <img th:src="${product.imgUrl}" 
                 class="w-full h-48 object-cover">

            <div class="p-4">

                <h2 class="text-xl font-semibold text-gray-800"
                    th:text="${product.pName}"></h2>

                <p class="text-gray-500 text-sm mt-1"
                   th:text="${product.category}"></p>

                <p class="text-gray-600 mt-1"
                   th:text="${product.brand}"></p>

                <p class="text-blue-600 font-bold text-lg mt-2"
                   th:text="'₹ ' + ${product.price}"></p>

                <div class="flex justify-between mt-4">

                    <a th:href="@{'/edit/' + ${product.productId}}"
                       class="bg-yellow-500 text-white px-4 py-1 rounded-lg hover:bg-yellow-600 transition">
                        Edit
                    </a>

                    <a th:href="@{'/delete/' + ${product.productId}}"
                       class="bg-red-500 text-white px-4 py-1 rounded-lg hover:bg-red-600 transition"
                       onclick="return confirm('Delete this product?');">
                        Delete
                    </a>

                </div>

            </div>
        </div>

    </div>

</body>
</html>
