<!DOCTYPE html>
<html xmlns="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>EComm Products</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white shadow-xl rounded-2xl p-8 w-full max-w-lg">
        
        <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">
            Add Product
        </h2>

        <form th:action="@{/save}" th:object="${product}" method="POST" class="space-y-4">

			<p th:if="${success}" th:text="${success}" class="text-green-600 font-medium mb-4 text-center"></p>
            <!-- Product Name -->
            <div>
                <label class="block text-gray-600 mb-1">Product Name</label>
                <input type="text" th:field="*{pName}"
                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 outline-none">
            </div>

            <!-- Category Dropdown -->
            <div>
                <label class="block text-gray-600 mb-1">Category</label>
                <select th:field="*{category}"
                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 outline-none bg-white">
                    
                    <option value="">-- Select Category --</option>
                    
                    <option th:each="category : ${category}"
                            th:value="${category}"
                            th:text="${category}">
                    </option>
                </select>
            </div>

            <!-- Brand -->
            <div>
                <label class="block text-gray-600 mb-1">Brand</label>
                <input type="text" th:field="*{brand}"
                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 outline-none">
            </div>

            <!-- Price -->
            <div>
                <label class="block text-gray-600 mb-1">Price</label>
                <input type="number" th:field="*{price}"
                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 outline-none">
            </div>

            <!-- Image URL -->
            <div>
                <label class="block text-gray-600 mb-1">Image URL</label>
                <input type="text" th:field="*{imgUrl}"
                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 outline-none">
            </div>

            <!-- Buttons -->
            <div class="flex justify-between items-center mt-6">
                
                <button type="submit"
                    class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition">
                    Add Product
                </button>

                <a href="/view"
                    class="text-blue-600 hover:underline">
                    View Products
                </a>

            </div>

        </form>
    </div>
</body>
</html>
