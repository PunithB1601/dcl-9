<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
	<div class="card shadow">
		<div class="class-header bg-primary text-white">
			<h3 class="text-center">Employee Register</h3>
		</div>
		
		<div class="card-body">
			
			<form th:action="@{/empapp/update}" th:object="${emp}" method="POST">
				<div class="mb-3">
					<label>Employee Name:</label>
					<input type="text" class="form-control" th:field="*{name}">
				</div>
				
				<div class="mb-3">
					<label>Employee Mail:</label>
					<input type="email" class="form-control" th:field="*{mail}">
				</div>
					<input type="hidden" th:field="*{eid}" value="${emp.eid}">
				<button class="btn btn-success">Update</button>
				<a href="@{/empapp/employees}" class="btn btn-danger">Back</a>	
			</form>
		
		
		</div>
	</div>
</div>

</body>
</html>
